# V1 configuration for the Indian Market Regime Trading System.
#
# This file holds every parameter that governs trading behavior. Secrets and
# per-deployment values (API keys, database URL) belong in `.env`, not here.
#
# Note on reconciliation with docs/SPECIFICATION.md:
# - The risk thresholds below match SPECIFICATION.md section 8 (the prose
#   risk-control table) and section 21 (its suggested config block) exactly
#   -- those two are consistent with each other in the source document.
#   `daily_loss_warning_pct` and `max_concurrent_positions` appear in section
#   8's prose table but were omitted from section 21's example config; both
#   are added here for completeness.
# - `selection.min_holdings` is set to 7 (not the spec's "5-10" range) because
#   7 holdings x `portfolio.max_single_name_pct` (15%) = 105%, which is the
#   minimum holding count that can actually reach the low-risk-tier exposure
#   ceiling of 100% without breaching the single-name cap. 5 holdings could
#   not (5 x 15% = 75% < 100%). See docs/ARCHITECTURE.md for detail.

market:
  exchange: NSE
  timezone: Asia/Kolkata
  bar_timeframe: 1D
  execution_delay_sessions: 1        # decision after session t, execution on t+1
  sessions:                          # NSE equity segment, Asia/Kolkata
    pre_open_start: "09:00"
    pre_open_end: "09:08"
    regular_open: "09:15"
    regular_close: "15:30"

data:
  raw_data_path: data_cache/raw            # vendor data as received; never rewritten
  normalized_data_path: data_cache/normalized
  reference_data_path: data_cache/reference
  quarantine_data_path: data_cache/quarantine
  calendar_file: config/nse_holidays.csv   # must be maintained from NSE's published list
  storage_format: parquet                  # parquet | csv
  instrument_master_max_age_days: 1
  market_data_max_staleness_minutes: 30
  stale_price_run_sessions: 5              # identical closes before flagging staleness
  volume_spike_multiple: 20                # x median volume before flagging a spike

features:
  # Windows for core/features/feature_engineering.py. A deliberately small,
  # fully-documented feature set -- see that module's docstring for the
  # economic interpretation and required lookback of each feature.
  realized_vol_window: 20        # nifty_realized_vol_20d, nifty_vol_ratio_5_20 (long leg)
  vol_ratio_short_window: 5      # nifty_vol_ratio_5_20 (short leg)
  vol_ratio_long_window: 20
  vix_zscore_window: 252         # india_vix_level_z (~1 trading year)
  vix_change_window: 5           # india_vix_change_5d
  trend_window: 200              # nifty_trend_200d
  drawdown_window: 252           # nifty_drawdown_from_high_252d
  atr_window: 14                 # nifty_atr_normalized_14d
  volume_stress_window: 20       # nifty_volume_stress_20d (skipped if volume is unavailable)

hmm:
  candidate_states: [3, 4, 5]
  covariance_type: diag              # diagonal default; see docs/ARCHITECTURE.md
  training_window_days: 756
  retrain_interval_sessions: 63      # quarterly
  min_confidence: 0.60
  confirmation_bars: 2
  flicker_window_sessions: 20
  max_covariance_condition_number: 1000000.0
  # Every (candidate_states x random_seeds) pair is fitted; the best surviving
  # candidate is chosen by BIC. Seeds are listed explicitly rather than derived
  # from a count so a training run is reproducible from config alone.
  random_seeds: [17, 29, 43, 71, 101]
  max_iterations: 200
  convergence_tolerance: 0.0001      # EM stops when the log-likelihood gain is below this
  covariance_regularization: 0.000001  # ridge added to each covariance diagonal
  min_state_occupancy: 0.02          # states occupying less than this are degenerate

# Allocation-tier exposure bands. Deliberately not a copy of the HMM's own
# calm/normal/elevated/crisis labels (core/regime/hmm_engine.py) -- these
# four tiers are what core/regime/allocation.py actually acts on, chosen
# fresh for this phase rather than carried over from an earlier design. See
# docs/ARCHITECTURE.md, "Resolved specification ambiguities" (B6).
regime_policy:
  low_risk:                          # highest permitted exposure
    min_gross_exposure: 0.75
    max_gross_exposure: 1.00
  normal_risk:                       # moderate exposure
    min_gross_exposure: 0.45
    max_gross_exposure: 0.75
  high_risk:                         # reduced exposure
    min_gross_exposure: 0.15
    max_gross_exposure: 0.45
  uncertain:                         # conservative exposure; no new positions
    min_gross_exposure: 0.00
    max_gross_exposure: 0.15

allocation:
  # Annualized volatility (from core/features nifty_realized_vol_20d, or the
  # rolling-vol baseline) below this is LOW_RISK; at/above the high threshold
  # is HIGH_RISK; between the two is NORMAL_RISK.
  low_risk_volatility_threshold: 0.12
  high_risk_volatility_threshold: 0.25
  extreme_confidence_threshold: 0.90   # confirms a new regime in 1 bar instead of hmm.confirmation_bars
  max_flicker_transitions: 3           # confirmed-regime changes tolerated within hmm.flicker_window_sessions
  baseline_volatility_window: 20       # trailing sessions for the non-HMM rolling-volatility baseline
  trend_ma_window_days: 200            # the non-HMM "simple 200-day moving-average risk filter" benchmark

universe:
  index_reference: NIFTY50
  min_avg_daily_value_inr: 50000000
  point_in_time: true
  exclude_illiquid: true

selection:
  # See universe/factor_calculator.py and universe/stock_selector.py for the
  # exact formula and point-in-time discipline behind each window.
  min_holdings: 7
  max_holdings: 10
  momentum_lookback_months: [3, 6]     # short/long horizons for blended risk-adjusted momentum
  momentum_skip_days: 21               # exclude the most recent ~1 month (avoid short-term reversal)
  trend_ma_window_days: 50             # moving-average window used inside trend_persistence
  trend_window_days: 100               # how many trailing sessions are checked against that MA
  relative_strength_window_days: 126   # ~6 months, vs. NIFTY 50 over the same window
  volatility_window_days: 63           # ~3 months, annualized realized volatility
  drawdown_window_days: 252            # ~1 year, distance from the trailing high
  liquidity_window_days: 20            # average daily traded value (INR)
  min_history_days: 252                # must cover the longest window above (drawdown, here)
  factor_weights:
    momentum: 0.30
    trend_persistence: 0.15
    relative_strength: 0.20
    volatility: 0.15                   # applied to -volatility: calmer stocks score higher
    drawdown: 0.10
    liquidity: 0.10

portfolio:
  # See portfolio/portfolio_constructor.py for the exact waterfall these
  # limits are applied in (single-name -> liquidity -> sector, each a pure
  # reduction so the order is deterministic and always converges).
  max_single_name_pct: 0.15
  max_sector_pct: 0.30
  min_position_weight_pct: 0.02        # positions smaller than this become cash instead
  max_pairwise_correlation: 0.80       # trailing correlation above this triggers a weight penalty
  correlation_lookback_days: 90
  correlation_penalty_pct: 0.50        # halves the lower-ranked member of an over-correlated pair
  min_correlation_observations: 40     # below this, skip the pair rather than act on a noisy estimate

risk:
  # See risk/risk_manager.py and risk/circuit_breaker.py for how these are
  # applied. Independent of, and a hard veto over, every upstream layer --
  # none of these thresholds are derived from the regime or the portfolio
  # constructor's own (looser, construction-time) limits.
  max_gross_exposure: 1.00
  max_leverage: 1.00
  max_single_name_pct: 0.15
  max_sector_pct: 0.30
  max_concurrent_positions: 10
  max_risk_per_position_pct: 0.005
  daily_loss_warning_pct: 0.015        # logged only; does not change circuit state
  daily_loss_reduce_pct: 0.020         # -> REDUCED_RISK
  daily_loss_halt_pct: 0.030           # -> HALTED
  rolling_loss_reduce_pct: 0.040       # rolling-window drawdown -> REDUCED_RISK
  rolling_loss_halt_pct: 0.060         # rolling-window drawdown -> HALTED
  peak_to_trough_drawdown_halt_pct: 0.10
  stale_data_max_minutes: 30
  max_pairwise_correlation: 0.85       # backstop above portfolio's 0.80 soft penalty threshold
  max_adv_participation_pct: 0.08      # backstop above execution's 0.05 soft construction target
  max_spread_bps: 100                  # liquid NSE large caps trade well under this; a spread this
                                        # wide signals a stressed or illiquid book, not just noise
  max_daily_turnover_pct: 0.50         # guards against a bug causing repeated full rebalances
  reduced_risk_exposure_multiplier: 0.50

execution:
  mode: paper                        # paper | live
  order_type: limit
  order_price_guard_bps: 50
  stale_quote_seconds: 15
  max_participation_adv_pct: 0.05
  no_market_order_fallback: true     # NSE algo orders may not use market orders

broker:
  provider: paper
  static_ip_required: true

backtest:
  training_window_sessions: 756
  test_window_sessions: 126
  roll_step_sessions: 63
  include_indian_costs: true
  include_slippage: true
  point_in_time_universe: true
  slippage_min_bps: 5.0              # floor so a tight-spread, liquid trade still carries a
                                      # realistic minimum slippage estimate (section 9.1)
  slippage_impact_coefficient: 50.0  # see backtest/costs.py's square-root impact model

# See backtest/cost_schedule.py -- rates are versioned data, not settings
# here, because NSE/SEBI/CDSL publish and revise them independently of this
# repository's release cycle.
costs:
  schedule_file: config/cost_schedules.yaml

database:
  url_env_var: DATABASE_URL
  pool_size: 5

logging:
  level: INFO
  format: json

monitoring:
  heartbeat_interval_seconds: 60
  alert_channels: []
