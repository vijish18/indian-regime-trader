# JSON Schema (draft 2020-12) for config/settings.yaml.
# Validated structurally at load time by config/loader.py before the typed
# pydantic models in config/models.py are constructed. Keep this in sync with
# config/models.py -- the schema catches malformed YAML early and documents
# the config shape for anyone who isn't reading Python.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: IndianRegimeTraderSettings
type: object
additionalProperties: false
required:
  - market
  - data
  - features
  - hmm
  - regime_policy
  - allocation
  - universe
  - selection
  - portfolio
  - risk
  - execution
  - broker
  - paper_trading
  - compliance
  - backtest
  - costs
  - database
  - logging
  - monitoring

definitions:
  factor_weights:
    type: object
    additionalProperties: false
    required:
      - momentum
      - trend_persistence
      - relative_strength
      - volatility
      - drawdown
      - liquidity
    properties:
      momentum: { type: number, minimum: 0 }
      trend_persistence: { type: number, minimum: 0 }
      relative_strength: { type: number, minimum: 0 }
      volatility: { type: number, minimum: 0 }
      drawdown: { type: number, minimum: 0 }
      liquidity: { type: number, minimum: 0 }

  exposure_band:
    type: object
    additionalProperties: false
    required: [min_gross_exposure, max_gross_exposure]
    properties:
      min_gross_exposure: { type: number, minimum: 0, maximum: 1 }
      max_gross_exposure: { type: number, minimum: 0, maximum: 1 }

properties:
  market:
    type: object
    additionalProperties: false
    required: [exchange, timezone, bar_timeframe, execution_delay_sessions, sessions]
    properties:
      exchange: { type: string, const: NSE }
      timezone: { type: string, const: Asia/Kolkata }
      bar_timeframe: { type: string, enum: [1D] }
      execution_delay_sessions: { type: integer, minimum: 1 }
      sessions:
        type: object
        additionalProperties: false
        required: [pre_open_start, pre_open_end, regular_open, regular_close]
        properties:
          pre_open_start: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
          pre_open_end: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
          regular_open: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
          regular_close: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }

  data:
    type: object
    additionalProperties: false
    required:
      - raw_data_path
      - normalized_data_path
      - reference_data_path
      - quarantine_data_path
      - calendar_file
      - storage_format
      - instrument_master_max_age_days
      - market_data_max_staleness_minutes
      - stale_price_run_sessions
      - volume_spike_multiple
    properties:
      raw_data_path: { type: string, minLength: 1 }
      normalized_data_path: { type: string, minLength: 1 }
      reference_data_path: { type: string, minLength: 1 }
      quarantine_data_path: { type: string, minLength: 1 }
      calendar_file: { type: string, minLength: 1 }
      storage_format: { type: string, enum: [parquet, csv] }
      instrument_master_max_age_days: { type: integer, minimum: 1 }
      market_data_max_staleness_minutes: { type: integer, minimum: 1 }
      stale_price_run_sessions: { type: integer, minimum: 2 }
      volume_spike_multiple: { type: number, exclusiveMinimum: 1 }

  features:
    type: object
    additionalProperties: false
    required:
      - realized_vol_window
      - vol_ratio_short_window
      - vol_ratio_long_window
      - vix_zscore_window
      - vix_change_window
      - trend_window
      - drawdown_window
      - atr_window
      - volume_stress_window
    properties:
      realized_vol_window: { type: integer, minimum: 2 }
      vol_ratio_short_window: { type: integer, minimum: 2 }
      vol_ratio_long_window: { type: integer, minimum: 2 }
      vix_zscore_window: { type: integer, minimum: 2 }
      vix_change_window: { type: integer, minimum: 1 }
      trend_window: { type: integer, minimum: 2 }
      drawdown_window: { type: integer, minimum: 2 }
      atr_window: { type: integer, minimum: 2 }
      volume_stress_window: { type: integer, minimum: 2 }

  hmm:
    type: object
    additionalProperties: false
    required:
      - candidate_states
      - covariance_type
      - training_window_days
      - retrain_interval_sessions
      - min_confidence
      - confirmation_bars
      - flicker_window_sessions
      - max_covariance_condition_number
      - random_seeds
      - max_iterations
      - convergence_tolerance
      - covariance_regularization
      - min_state_occupancy
    properties:
      candidate_states:
        type: array
        items: { type: integer, minimum: 2, maximum: 10 }
        minItems: 1
      covariance_type: { type: string, enum: [diag, full] }
      training_window_days: { type: integer, minimum: 252 }
      retrain_interval_sessions: { type: integer, minimum: 1 }
      min_confidence: { type: number, minimum: 0, maximum: 1 }
      confirmation_bars: { type: integer, minimum: 1 }
      flicker_window_sessions: { type: integer, minimum: 1 }
      max_covariance_condition_number: { type: number, exclusiveMinimum: 0 }
      random_seeds:
        type: array
        items: { type: integer }
        minItems: 1
      max_iterations: { type: integer, minimum: 1 }
      convergence_tolerance: { type: number, exclusiveMinimum: 0 }
      covariance_regularization: { type: number, exclusiveMinimum: 0 }
      min_state_occupancy: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }

  regime_policy:
    type: object
    additionalProperties: false
    required: [low_risk, normal_risk, high_risk, uncertain]
    properties:
      low_risk: { $ref: "#/definitions/exposure_band" }
      normal_risk: { $ref: "#/definitions/exposure_band" }
      high_risk: { $ref: "#/definitions/exposure_band" }
      uncertain: { $ref: "#/definitions/exposure_band" }

  allocation:
    type: object
    additionalProperties: false
    required:
      - low_risk_volatility_threshold
      - high_risk_volatility_threshold
      - extreme_confidence_threshold
      - max_flicker_transitions
      - baseline_volatility_window
      - trend_ma_window_days
    properties:
      low_risk_volatility_threshold: { type: number, exclusiveMinimum: 0 }
      high_risk_volatility_threshold: { type: number, exclusiveMinimum: 0 }
      extreme_confidence_threshold: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_flicker_transitions: { type: integer, minimum: 0 }
      baseline_volatility_window: { type: integer, minimum: 2 }
      trend_ma_window_days: { type: integer, minimum: 2 }

  universe:
    type: object
    additionalProperties: false
    required: [index_reference, min_avg_daily_value_inr, point_in_time, exclude_illiquid]
    properties:
      index_reference: { type: string, minLength: 1 }
      min_avg_daily_value_inr: { type: number, minimum: 0 }
      point_in_time: { type: boolean, const: true }
      exclude_illiquid: { type: boolean }

  selection:
    type: object
    additionalProperties: false
    required:
      - min_holdings
      - max_holdings
      - momentum_lookback_months
      - momentum_skip_days
      - trend_ma_window_days
      - trend_window_days
      - relative_strength_window_days
      - volatility_window_days
      - drawdown_window_days
      - liquidity_window_days
      - min_history_days
      - factor_weights
    properties:
      min_holdings: { type: integer, minimum: 1 }
      max_holdings: { type: integer, minimum: 1 }
      momentum_lookback_months:
        type: array
        items: { type: integer, minimum: 1 }
        minItems: 2
        maxItems: 2
      momentum_skip_days: { type: integer, minimum: 0 }
      trend_ma_window_days: { type: integer, minimum: 2 }
      trend_window_days: { type: integer, minimum: 2 }
      relative_strength_window_days: { type: integer, minimum: 2 }
      volatility_window_days: { type: integer, minimum: 2 }
      drawdown_window_days: { type: integer, minimum: 2 }
      liquidity_window_days: { type: integer, minimum: 2 }
      min_history_days: { type: integer, minimum: 2 }
      factor_weights: { $ref: "#/definitions/factor_weights" }

  portfolio:
    type: object
    additionalProperties: false
    required:
      - max_single_name_pct
      - max_sector_pct
      - min_position_weight_pct
      - max_pairwise_correlation
      - correlation_lookback_days
      - correlation_penalty_pct
      - min_correlation_observations
    properties:
      max_single_name_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_sector_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      min_position_weight_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_pairwise_correlation: { type: number, exclusiveMinimum: 0, maximum: 1 }
      correlation_lookback_days: { type: integer, minimum: 2 }
      correlation_penalty_pct: { type: number, minimum: 0, exclusiveMaximum: 1 }
      min_correlation_observations: { type: integer, minimum: 2 }

  risk:
    type: object
    additionalProperties: false
    required:
      - max_gross_exposure
      - max_leverage
      - max_single_name_pct
      - max_sector_pct
      - max_concurrent_positions
      - max_risk_per_position_pct
      - daily_loss_warning_pct
      - daily_loss_reduce_pct
      - daily_loss_halt_pct
      - rolling_loss_reduce_pct
      - rolling_loss_halt_pct
      - peak_to_trough_drawdown_halt_pct
      - stale_data_max_minutes
      - max_pairwise_correlation
      - max_adv_participation_pct
      - max_spread_bps
      - max_daily_turnover_pct
      - reduced_risk_exposure_multiplier
      - stop_loss
    properties:
      max_gross_exposure: { type: number, minimum: 0, maximum: 1 }
      max_leverage: { type: number, minimum: 1, maximum: 1 }
      max_single_name_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_sector_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_concurrent_positions: { type: integer, minimum: 1 }
      max_risk_per_position_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      daily_loss_warning_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      daily_loss_reduce_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      daily_loss_halt_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      rolling_loss_reduce_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      rolling_loss_halt_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      peak_to_trough_drawdown_halt_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      stale_data_max_minutes: { type: integer, minimum: 1 }
      max_pairwise_correlation: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_adv_participation_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      max_spread_bps: { type: number, exclusiveMinimum: 0 }
      max_daily_turnover_pct: { type: number, exclusiveMinimum: 0 }
      reduced_risk_exposure_multiplier: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
      stop_loss:
        type: object
        additionalProperties: false
        required:
          [enabled, hard_stop_pct, trail_drop_pct, trail_arm_net_profit_pct, close_on_arm]
        properties:
          enabled: { type: boolean }
          close_on_arm: { type: boolean }
          hard_stop_pct: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
          trail_drop_pct: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }
          trail_arm_net_profit_pct: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1 }

  execution:
    type: object
    additionalProperties: false
    required:
      - mode
      - order_type
      - order_price_guard_bps
      - stale_quote_seconds
      - max_participation_adv_pct
      - no_market_order_fallback
    properties:
      mode: { type: string, enum: [paper, live] }
      order_type: { type: string, enum: [limit] }
      order_price_guard_bps: { type: number, minimum: 0 }
      stale_quote_seconds: { type: integer, minimum: 1 }
      max_participation_adv_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      no_market_order_fallback: { type: boolean, const: true }

  broker:
    type: object
    additionalProperties: false
    required: [provider, static_ip_required]
    properties:
      provider: { type: string, enum: [paper, zerodha] }
      static_ip_required: { type: boolean }

  paper_book:
    type: object
    additionalProperties: false
    required: [budget_inr, max_rank_to_buy, rerank_at_positions, rerank_cooldown_minutes]
    properties:
      budget_inr: { type: number, exclusiveMinimum: 0 }
      max_rank_to_buy: { type: integer, minimum: 1 }
      rerank_at_positions: { type: integer, minimum: 0 }
      rerank_cooldown_minutes: { type: integer, minimum: 0 }

  paper_trading:
    type: object
    additionalProperties: false
    required:
      - submission_latency_ms
      - max_fill_participation_pct
      - order_expiry_seconds
      - default_avg_daily_value_inr
      - default_volatility
    properties:
      submission_latency_ms: { type: integer, minimum: 0 }
      max_fill_participation_pct: { type: number, exclusiveMinimum: 0, maximum: 1 }
      order_expiry_seconds: { type: integer, minimum: 1 }
      default_avg_daily_value_inr: { type: number, minimum: 0 }
      default_volatility: { type: number, minimum: 0 }

  compliance:
    type: object
    additionalProperties: false
    required:
      - compliance_version
      - broker_authorization_confirmed
      - static_ip_primary
      - algo_identifier
      - allowed_order_types
      - allowed_validities
      - max_orders_per_second
      - session_max_age_hours
      - audit_log_retention_years
    properties:
      compliance_version: { type: string, minLength: 1 }
      broker_authorization_confirmed: { type: boolean }
      static_ip_primary: { type: string, minLength: 1 }
      static_ip_secondary: { type: [string, "null"] }
      algo_identifier: { type: string, minLength: 1 }
      allowed_order_types: { type: array, minItems: 1, items: { type: string } }
      allowed_validities: { type: array, minItems: 1, items: { type: string } }
      max_orders_per_second: { type: integer, minimum: 1, maximum: 10 }
      session_max_age_hours: { type: number, exclusiveMinimum: 0, maximum: 24 }
      audit_log_retention_years: { type: integer, minimum: 1 }

  backtest:
    type: object
    additionalProperties: false
    required:
      - training_window_sessions
      - test_window_sessions
      - roll_step_sessions
      - include_indian_costs
      - include_slippage
      - point_in_time_universe
      - slippage_min_bps
      - slippage_impact_coefficient
    properties:
      training_window_sessions: { type: integer, minimum: 1 }
      test_window_sessions: { type: integer, minimum: 1 }
      roll_step_sessions: { type: integer, minimum: 1 }
      include_indian_costs: { type: boolean, const: true }
      include_slippage: { type: boolean, const: true }
      point_in_time_universe: { type: boolean, const: true }
      slippage_min_bps: { type: number, minimum: 0 }
      slippage_impact_coefficient: { type: number, minimum: 0 }

  costs:
    type: object
    additionalProperties: false
    required:
      - schedule_file
    properties:
      schedule_file: { type: string, minLength: 1 }

  database:
    type: object
    additionalProperties: false
    required: [url_env_var, pool_size]
    properties:
      url_env_var: { type: string, minLength: 1 }
      pool_size: { type: integer, minimum: 1 }

  logging:
    type: object
    additionalProperties: false
    required: [level, format]
    properties:
      level: { type: string, enum: [DEBUG, INFO, WARNING, ERROR] }
      format: { type: string, enum: [json, text] }
      # Phase 23. Absent (or null) means stdout only, which is the right
      # default for a development shell. Production sets it to a path on a
      # mounted volume so the audit trail outlives the container.
      audit_log_path: { type: [string, "null"] }
      audit_log_max_bytes: { type: integer, minimum: 1024 }
      audit_log_backup_count: { type: integer, minimum: 1 }

  monitoring:
    type: object
    additionalProperties: false
    required: [heartbeat_interval_seconds, alert_channels, alert_cooldown_seconds]
    properties:
      heartbeat_interval_seconds: { type: integer, minimum: 1 }
      alert_channels:
        type: array
        items: { type: string, enum: [log, webhook] }
      alert_cooldown_seconds: { type: integer, minimum: 1 }

      # Name of the environment variable holding the webhook URL, never the
      # URL. A pattern rather than a free string so a URL pasted here is
      # rejected outright instead of being committed as a credential.
      alert_webhook_url_env:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
      alert_webhook_message_field: { type: string, minLength: 1 }
      alert_webhook_static_fields:
        type: object
        additionalProperties: { type: string }
      alert_webhook_timeout_seconds:
        type: number
        exclusiveMinimum: 0
        maximum: 60
