[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-regime-trader"
version = "0.1.0"
description = "India-focused, long-only systematic equity trading system with HMM-based market-regime gating."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Vijish" }]

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.21,<5",
    "python-dotenv>=1.0,<2",
    "pandas>=2.2.3,<3",
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "mypy>=1.9,<2",
    "ruff>=0.4,<1",
    "pandas-stubs>=2.2,<3",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.21,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "core*",
    "data*",
    "universe*",
    "portfolio*",
    "risk*",
    "execution*",
    "broker*",
    "backtest*",
    "monitoring*",
    "storage*",
]
exclude = ["tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that touch the network, a broker API, or a real database (excluded by default).",
]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
